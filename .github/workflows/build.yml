name: Build Luau LSP WASM

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (com submódulos)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rodar build.sh
        run: bash web/build.sh

      - name: Diagnóstico — listar tudo que foi gerado
        if: always()
        run: |
          echo "===== build/ ====="
          ls -la build/ || true
          echo "===== web/public/ ====="
          ls -la web/public/ || true
          echo "===== web/ ====="
          ls -la web/ || true

      - name: Upload do build/ completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-folder
          path: build/
          if-no-files-found: warn

      - name: Upload do web/public/ completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-public-folder
          path: web/public/
          if-no-files-found: warn

      - name: Upload dos artefatos finais
        uses: actions/upload-artifact@v4
        with:
          name: luau-lsp-wasm
          path: |
            web/public/Luau.LanguageServer.Web.js
            web/public/Luau.LanguageServer.Web.wasm
          if-no-files-found: error
