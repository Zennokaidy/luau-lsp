name: Build Luau LSP WASM

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (com submódulos)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Limpar artefatos antigos de web/public
        run: |
          rm -f web/public/Luau.LanguageServer.Web.js
          rm -f web/public/Luau.LanguageServer.Web.wasm

      - name: Build da imagem Docker (Emscripten)
        run: docker build -t emscripten_updated web

      - name: Configurar CMake (com patch de compatibilidade)
        run: |
          docker run --rm -v $(pwd):/src emscripten_updated \
            emcmake cmake -S/src -B/src/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Compilar o alvo Web (WASM)
        run: |
          docker run --rm -v $(pwd):/src emscripten_updated \
            cmake --build /src/build \
            --target Luau.LanguageServer.Web \
            --config Release

      - name: Instalar dependências do demo web
        working-directory: web
        run: npm install

      - name: Montar arquivos finais em web/public/
        run: |
          cat web/demoprepend.js build/Luau.LanguageServer.Web.js > web/public/Luau.LanguageServer.Web.js
          cp build/Luau.LanguageServer.Web.wasm web/public/Luau.LanguageServer.Web.wasm

      - name: Diagnóstico (sempre roda)
        if: always()
        run: |
          echo "===== build/ ====="
          ls -la build/ || true
          echo "===== web/public/ ====="
          ls -la web/public/ || true

      - name: Upload dos artefatos finais
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: luau-lsp-wasm
          path: |
            web/public/Luau.LanguageServer.Web.js
            web/public/Luau.LanguageServer.Web.wasm
          if-no-files-found: error
